server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A rejected upload must speak the same error contract as the API, or the UI can
    # only show a generic failure for something with an obvious cause.
    error_page 413 = @payload_too_large;
    location @payload_too_large {
        default_type application/json;
        return 413 '{"status":413,"code":"FILE_TOO_LARGE","message":"Uploaded file exceeds the size limit","fieldErrors":[]}';
    }

    # API is proxied to the backend service on the compose network.
    location /api {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Must stay above Spring's max-file-size so the app can answer with its own error.
        client_max_body_size 32m;
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }
}
