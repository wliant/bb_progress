# Application stack. The stateful services live in docker-compose.infra.yml and
# must be running first:
#
#   docker compose -f docker-compose.infra.yml up -d --wait
#   docker compose up -d --build --force-recreate
#
# `depends_on` cannot reach across compose projects, so the app instead restarts
# until the database and object store answer. Starting infra with --wait avoids
# that loop entirely.
name: ${INSTANCE:-bbprogress}

services:
  app:
    build: ./app
    environment:
      # Both endpoints come from .env, so the app can be pointed at an external
      # database or at real AWS S3 without editing this file. A blank S3_ENDPOINT
      # is meaningful — it selects real AWS — so it is passed through as-is.
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?set SPRING_DATASOURCE_URL in .env}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      TZ: ${TZ:-Asia/Singapore}
    extra_hosts:
      # On Linux, host.docker.internal is not resolvable by default. Map it to the
      # host gateway so SPRING_DATASOURCE_URL / S3_ENDPOINT can point at services
      # running on the host (Docker Desktop provides this automatically).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      # The port only opens once the Spring context (incl. Flyway) is up.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

  web:
    build: ./web
    ports:
      - "${APP_PORT}:80"
    restart: unless-stopped
    depends_on:
      # Only that the container exists, so nginx can resolve `app` — not that it is
      # healthy. Waiting for health would leave the UI unstarted whenever the app is
      # still waiting on infrastructure; this way nginx serves the page and the API
      # calls fail visibly until the backend catches up.
      app:
        condition: service_started

networks:
  # Created by docker-compose.infra.yml; joining it gives `db` and `minio` their
  # usual hostnames without publishing either to the host.
  default:
    name: ${INSTANCE:-bbprogress}-net
    external: true
