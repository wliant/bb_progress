spring:
  application:
    name: bb-progress-app
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/bb}
    username: ${SPRING_DATASOURCE_USERNAME:bb}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: Asia/Singapore
  servlet:
    multipart:
      # Accept a photo straight off a phone; log photos are re-encoded to <=1MB on save.
      max-file-size: 25MB
      max-request-size: 30MB

app:
  # Photo bytes live in S3-compatible object storage. Leave `endpoint` blank to use real AWS S3;
  # set it to a MinIO URL (as docker-compose does) to keep everything local.
  s3:
    bucket: ${S3_BUCKET:bb-progress}
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    path-style: ${S3_PATH_STYLE:true}
    create-bucket-if-missing: ${S3_CREATE_BUCKET:true}

management:
  endpoints:
    web:
      exposure:
        include: health
