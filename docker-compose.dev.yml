# Dev override for the infrastructure stack: publishes Postgres and MinIO to the
# host so `./gradlew bootRun` and `npm run dev` can run natively against them.
#
#   docker compose -f docker-compose.infra.yml -f docker-compose.dev.yml up -d --wait
services:
  db:
    ports:
      - "${DB_PORT:-5433}:5432"
  minio:
    ports:
      - "${S3_PORT:-9000}:9000"
